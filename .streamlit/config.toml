# Streamlit config for the sandbox demo.
[server]
# Disable the file watcher. Streamlit's default watcher walks module internals on
# rerun and crashes when it inspects PyTorch's `torch.classes` (a known torch +
# Streamlit incompatibility), which shows up as a "Connection error" in the
# browser. We don't need hot-reload for the demo, so turn it off.
fileWatcherType = "none"
headless = true

[browser]
gatherUsageStats = false

# Dark, aesthetic theme — slate background with a teal/indigo accent.
[theme]
base = "dark"
primaryColor = "#5eead4"            # teal accent (buttons, highlights)
backgroundColor = "#0f172a"         # slate-900 page background
secondaryBackgroundColor = "#1e293b" # slate-800 cards/sidebar
textColor = "#e2e8f0"               # slate-200 text
font = "sans serif"
