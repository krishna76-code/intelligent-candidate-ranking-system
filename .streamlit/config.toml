# Streamlit config for the sandbox demo.
[server]
# Disable the file watcher. Streamlit's default watcher walks module internals on
# rerun and crashes when it inspects PyTorch's `torch.classes` (a known torch +
# Streamlit incompatibility), which shows up as a "Connection error" in the
# browser. We don't need hot-reload for the demo, so turn it off.
fileWatcherType = "none"
headless = true

[browser]
gatherUsageStats = false

# Dark emerald theme — deep teal-slate background with emerald/mint accents.
[theme]
base = "dark"
primaryColor = "#10b981"            # emerald accent (buttons, highlights)
backgroundColor = "#0b1720"         # deep teal-slate page background
secondaryBackgroundColor = "#13232e" # slate-green cards/sidebar
textColor = "#e6f0ee"               # mint-white text
font = "sans serif"
