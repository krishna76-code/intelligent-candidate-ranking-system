# ============================================================================
# Compute environment
# ============================================================================
compute:
  platform: "Local Windows laptop (AMD Ryzen 7 4800H)"   # ranking runs CPU-only
  cpu_cores: 8                                  # 8 physical cores (16 logical)
  ram_gb: 16                                    # 16 GB RAM
  python_version: "3.12.10"                     # python --version
  os: "Windows 11 Home (build 26200)"
  uses_gpu_for_inference: false                 # ranking (rank.py) is CPU-only, no model, no GPU
  has_network_during_ranking: false             # no API calls during ranking
  pre_computation_required: true                # embeddings are precomputed offline (bge-base)
  pre_computation_time_minutes: 120             # ~2h to embed 100k on a 4GB laptop GPU (offline, no limit)

# ============================================================================
# AI tools declaration
# ============================================================================
# Transparency only — declared use is NOT penalized. Be honest. Stage 5 interview
# may verify these declarations against your code; declarations that contradict
# your code or your interview are flagged.
ai_tools_used:
  - "Claude"        # e.g. for architecture discussion, code review
  - "GitHub Copilot"  # e.g. for autocomplete
  - "Gemini"
  # Other options: "ChatGPT", "Cursor", "Gemini", "Codeium", "Other", "None"

ai_usage_summary: |
  We used Claude as a pair-programming and code-review assistant throughout:
  discussing the architecture (the filter-first design and why embeddings are one
  feature rather than the spine), verifying data facts against the real dataset,
  catching bugs, and drafting docstrings/README text. GitHub Copilot and Gemini
  were used for occasional autocomplete and quick lookups. All engineering
  decisions, weight choices, and validation were made and verified by the team.
  No candidate data was sent to any hosted LLM at ranking time; the ranking step
  runs fully offline on CPU.

# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  Filter first, rank second. Cheap, explainable hard filters remove the obvious
  rejects (honeypots with impossible founding dates / fake "expert" skills /
  inflated experience, consulting-only careers, candidates who cannot relocate to
  India, and non-engineering titles claiming AI skills). Survivors are scored by a
  transparent weighted feature model: title-role match (0.24) and career evidence
  of retrieval/ranking/recommendation work (0.22) carry the ranking; bge-base
  embedding similarity is one feature (0.14), not the backbone, because on this
  templated dataset embeddings barely separate strong from weak candidates
  (measured gap ~0.04). Remaining weights cover experience fit, product-vs-services,
  skill trust, assessment bonus, and recency-of-code. JD-specific soft penalties
  (title-chaser, LangChain-only, CV/speech-only, research-only) and a behavioral
  multiplier (recruiter response rate, recency) adjust the score, which is
  normalized to [0,1]. Embeddings are precomputed offline; the ranking step loads
  them and runs CPU-only with no network in ~30-46s on 100k. Each row gets a
  specific, honest reasoning string. Validated via an eyeball test, a hand-labeled
  set, and an embedding-separation measurement.

